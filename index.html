<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen 1er seguimiento de Graficación</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados (corregido de styles.css a style.css) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor principal con marco exterior -->
    <div class="main-box container text-center my-5 p-4">
        
        <!-- Título con 'Graficación' en negrita -->
        <h1 class="fw-normal mb-4">Examen 1er seguimiento de <strong>Graficación</strong></h1>
        
        <!-- Imagen centrada -->
        <div id="image-container" class="my-4 d-flex justify-content-center align-items-center">
            <img id="image" src="imagenes/halloween.svg" alt="Imagen de ejemplo" class="img-fluid">
        </div>

        <div class="btn-group my-3" role="group">
            <button id="xSmallBtn" class="btn btn-warning">X-Pequeño!</button>
            <button id="smallBtn" class="btn btn-primary">Pequeño</button>
            <button id="mediumBtn" class="btn btn-secondary">Mediano</button>
            <button id="largeBtn" class="btn btn-success">Grande</button>
            <button id="xLargeBtn" class="btn btn-danger">X-Grande!</button>
        </div>

        <!-- Integrantes con negrita solo en 'Estudiante X' -->
        <div class="mt-4">
            <h2 class="fw-normal h3 mb-3">Integrantes del equipo:</h2>
            <p class="fs-5 mb-1 fw-normal">24200765 - <strong>Ascencio Flores Javier Alessandro</strong></p>
            <p class="fs-5 mb-1 fw-normal">24201348 - <strong>Fernández Pérez Ruben</strong></p>
            <p class="fs-5 mb-1 fw-normal">24200827 - <strong>Osorio Escamilla Juan David</strong></p>
        </div>
        
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
